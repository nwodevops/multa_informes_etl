# Manifiesto de fuentes — copiar a inputs.yaml en la raíz del proyecto.
# Python (create_stg.py) solo DDL STG_*; Hop extrae filas.
# Sheets/Excel: types varchar (#N/A). Ver reference.md

sources:
  - stg_table: STG_ORA_EJEMPLO
    type: oracle
    connection: oracle_sisud
    object: SISUD.VW_EJEMPLO

  - stg_table: STG_MYSQL_EJEMPLO
    type: mysql
    connection: mysql
    object: gappsdb.T_EJEMPLO

  - stg_table: STG_GS1_EJEMPLO
    type: sheets
    spreadsheet_key: ${SPREADSHEET_KEY_GS1}
    worksheet: "Hoja 1"
    types: varchar

  - stg_table: STG_GS1_MULTAS
    type: excel
    path: input_excel/ejemplo.xlsx
    worksheet: "Datos"
    header_row: 3
    types: varchar
