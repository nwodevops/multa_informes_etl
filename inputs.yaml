# Manifiesto de fuentes STG. Python (python/create_stg.py) lo lee y crea
# CREATE TABLE en H2. Hop extrae las filas. No commitear keys/passwords.
#
# type: oracle | sheets | excel
# Contrato: .agents/skills/hop-python-etl/inputs.example.yaml
# Excel local: path relativo a la raíz, header_row = fila de códigos (1-based).
# F1 ODs: catálogo docs/inputs/f1_ods_sheets.json (Google Sheets; no Excel local).
# F2 CSEP: catálogo docs/inputs/f2_csep_sheets.json (Google Sheets; Excel CAGR en legacy).

sources:
  - stg_table: STG_GS1_CSEP_MULTAS
    type: sheets
    familia: f2_csep
    catalog: docs/inputs/f2_csep_sheets.json
    types: varchar

  - stg_table: STG_GS1_ETAPAS
    type: excel
    path: input_excel/legacy/CAGR_ MA OEFA - 3) MULTAS COERCITIVAS.xlsx
    worksheet: "2) Etapas"
    header_row: 2
    types: varchar

  - stg_table: STG_GS2_OD_MULTAS
    type: sheets
    familia: f1_od
    catalog: docs/inputs/f1_ods_sheets.json
    types: varchar

  - stg_table: STG_GS1_DIC_TABLAS
    type: excel
    path: input_excel/legacy/CAGR_ MA OEFA - 3) MULTAS COERCITIVAS.xlsx
    worksheet: "DIC_TABLAS"
    header_row: 1
    types: varchar

  - stg_table: STG_GS1_DIC_VARIABLES
    type: excel
    path: input_excel/legacy/CAGR_ MA OEFA - 3) MULTAS COERCITIVAS.xlsx
    worksheet: "DIC_VARIABLES"
    header_row: 1
    types: varchar

  - stg_table: STG_ORA_VW_MULTA_COERCITIVA
    type: oracle
    connection: oracle_sisud
    object: SISUD.VW_MULTA_COERCITIVA
