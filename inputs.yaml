# Manifiesto de fuentes STG. Python (python/create_stg.py) lo lee y crea
# CREATE TABLE en H2. Hop extrae las filas. No commitear keys/passwords.
#
# type: oracle | sheets | mysql
# Contrato: .agents/skills/hop-python-etl/inputs.example.yaml
# F1 ODs: catálogo docs/inputs/f1_ods_sheets.json (Google Sheets).
# F2 CSEP: catálogo docs/inputs/f2_csep_sheets.json (multas + etapas).
# Excel local no entra al pipeline.

sources:
  - stg_table: STG_GS1_CSEP_MULTAS
    type: sheets
    familia: f2_csep
    catalog: docs/inputs/f2_csep_sheets.json
    types: varchar

  - stg_table: STG_GS1_ETAPAS
    type: sheets
    familia: f2_csep
    catalog: docs/inputs/f2_csep_sheets.json
    types: varchar

  - stg_table: STG_GS2_OD_MULTAS
    type: sheets
    familia: f1_od
    catalog: docs/inputs/f1_ods_sheets.json
    types: varchar

  - stg_table: STG_ORA_VW_MULTA_COERCITIVA
    type: oracle
    connection: oracle_sisud
    object: SISUD.VW_MULTA_COERCITIVA

  - stg_table: STG_MYSQL_MULTAS
    type: mysql
    connection: mysql
    sql_file: input_legacy/input_mysql/vw_multas_app.sql
    types: varchar
